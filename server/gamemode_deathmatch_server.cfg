// gamemode_deathmatch_server.cfg - Deathmatch overrides for the Over Strike 2 server.
// The engine executes this file right after Valve's gamemode_deathmatch.cfg on EVERY load of a Deathmatch map
// (game_type 1, game_mode 2; the exec block in gamemodes.txt), so these values beat the mode defaults and survive
// SteamCMD updates. Deathmatch comes through the end-of-match vote; the bridge loads its maps with the mode set
// (bridge/Shared/Modes.cs). Everything else is Valve's: free-for-all, respawns, free buys during spawn protection,
// a 10-minute match. Source of truth: server/ in the repository; a deployment puts it into the game's cfg folder.

bot_quota 0                       // Valve fills Deathmatch with 10 bots; this server runs none (CounterStrikeSharp issue #1446).
bot_quota_mode normal             // Valve's fill_with_minimum adds a bot even at bot_quota 0: one joined the first player on de_dust2 (seen live).

// Match flow, as in Arms Race: the map replays after a match, and the bridge's vote picks the next one.
mp_warmuptime 1                   // Valve's 20 s; the engine floors this at 5 s.
mp_warmup_pausetimer 0            // Keep the warmup timer running.
mp_team_intro_time 0              // No team-intro cinematic.
mp_match_end_restart 1            // Restart on the same map when the match ends...
mp_match_end_changelevel 0        // ...never rotate through a mapgroup: the bridge drives map changes.
mp_endmatch_votenextmap 0         // No CS2 end-of-match map vote: the bridge's vote is on the HUD.
mp_match_restart_delay 90         // The match-end screen lasts through the bridge's vote: 60 s, the 8 s countdown and over 15 s of margin, since CS2 shows 4 s less than this (Valve's 25).

// No F1/F2 votes, as in Arms Race (Valve's Deathmatch allows them).
sv_allow_votes 0
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_pause_match_allowed 0
sv_vote_issue_timeout_allowed 0
sv_vote_issue_surrrender_allowed 0   // Valve's spelling, three r's.
sv_vote_issue_matchready_allowed 0
sv_vote_issue_loadbackup_allowed 0
sv_vote_issue_scramble_teams_allowed 0
sv_vote_issue_swap_teams_allowed 0

// Small-group comfort, as in Arms Race.
mp_autokick 0                     // Never kick idle friends.
mp_autoteambalance 1              // Keep teams even as people join and leave.
mp_team_timeout_max 0             // No tactical timeouts.
sv_workshop_allow_other_maps 1    // Let host_workshop_map load any workshop map, not only collection members.
