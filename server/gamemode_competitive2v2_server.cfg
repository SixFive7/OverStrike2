// gamemode_competitive2v2_server.cfg - Wingman overrides for the Over Strike 2 server.
// The engine executes this file right after Valve's gamemode_competitive2v2.cfg on EVERY load of a Wingman map
// (game_type 0, game_mode 2; the exec block in gamemodes.txt), so these values beat the mode defaults and survive
// SteamCMD updates. Wingman comes through the end-of-match vote; the bridge loads its maps with the mode set
// (bridge/Shared/Modes.cs). Everything else is Valve's: two teams, buying, bomb rounds. A match is 16 rounds, first to 9, the sides switching after 8, which !time 8 makes
// 8 (first to 5, switching after 4) - the bridge sets the chosen mp_maxrounds 2 s after every load, at a match's end and
// before its Restart match (bridge/MatchTime.cs). Source of truth: server/ in the repository; a deployment puts it into
// the game's cfg folder.

bot_quota 0                       // Valve adds a bot; this server runs none (CounterStrikeSharp issue #1446).
bot_quota_mode normal             // Valve's competitive mode fills the teams with bots; Deathmatch's fill_with_minimum added one even at bot_quota 0.

// Match flow: the map replays after a match, and the bridge's vote picks the next one.
mp_maxrounds 16                   // The match length: 16 rounds, Valve's, named here as Deathmatch's 60 minutes are. !time 8 makes it 8.
mp_warmup_online_enabled 0        // No warmup, as in Arms Race and Deathmatch: a match is on once the first player is in, and every player
                                  // who joins in its first minute restarts it for fairness (plugin/OverStrike2/EarlyJoinWatch.cs).
mp_warmuptime 15                  // Does nothing while the warmup is off; were it on again, Valve's 120 s is for strangers.
mp_warmup_pausetimer 0            // Keep the warmup timer running.
mp_team_intro_time 0              // No team-intro cinematic.
mp_round_restart_delay 7          // The pause after a round's win (CS2's own; Arms Race sets 0 and Wingman's cfg does not name it).
mp_match_end_restart 1            // Restart on the same map when the match ends...
mp_match_end_changelevel 0        // ...never rotate through a mapgroup: the bridge drives map changes.
mp_endmatch_votenextmap 0         // No CS2 end-of-match map vote: the bridge's vote is on the HUD.
mp_match_restart_delay 90         // The match-end screen lasts through the bridge's vote: 60 s, the 8 s countdown and over 15 s of margin, since CS2 shows 4 s less than this (Valve's 25).

// What Arms Race or Deathmatch would leave behind: Valve's Wingman cfg does not name these.
mp_teammates_are_enemies 0        // Two teams (Deathmatch is free-for-all).
mp_buy_allow_grenades 1           // Grenades can be bought (Arms Race and Deathmatch set 0).
mp_weapons_allow_typecount 5      // CS2's own limit per weapon type (Arms Race and Deathmatch set -1, unlimited).

// A player who comes in late still plays the round - a join after the fairness restart's minute too.
mp_join_grace_time 30             // CS2's 0. Joined within 30 s of a round's start (its 10 s freeze time included), they spawn in it instead of watching it.

// No F1/F2 votes (Valve's Wingman allows them).
sv_allow_votes 0
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_pause_match_allowed 0
sv_vote_issue_timeout_allowed 0
sv_vote_issue_surrrender_allowed 0   // Valve's spelling, three r's.
sv_vote_issue_matchready_allowed 0
sv_vote_issue_loadbackup_allowed 0
sv_vote_issue_scramble_teams_allowed 0
sv_vote_issue_swap_teams_allowed 0

// Small-group comfort, as in Arms Race.
mp_autokick 0                     // Never kick idle friends.
mp_autoteambalance 1              // Keep teams even as people join and leave.
mp_limitteams 1                   // Max team-size difference of 1.
mp_team_timeout_max 0             // No tactical timeouts.
sv_workshop_allow_other_maps 1    // Let host_workshop_map load any workshop map, not only collection members.
