// gamemode_armsrace_server.cfg - Arms Race overrides for the Over Strike 2 server.
// The engine executes this file right after Valve's gamemode_armsrace.cfg on EVERY map load
// (gamemodes.txt exec block), so these values beat the mode defaults and survive SteamCMD
// updates. Source of truth: server/ in this repository; a deployment puts it into the game's
// cfg folder (deploy/).

// The two that used to need retyping after every map change.
bot_quota 0                       // Mode default is 10 with bot_quota_mode fill, which refills after bot_kick.
mp_roundtime 60                   // Engine clamp maximum. Arms Race is a single round, so this is the match length.
mp_timelimit 0                    // Mode default 10; irrelevant with one round, set explicitly.

// Match flow: replay the same map after a win until the bridge's vote picks another.
mp_warmup_online_enabled 0        // No warmup: the match is live the moment the first player picks a team (mp_warmuptime cannot go below 5 s, and 4 s
                                  // more followed it). Every player who joins in its first minute restarts it, for fairness (plugin/OverStrike2/EarlyJoinWatch.cs).
mp_warmuptime 1                   // Mode default 20; does nothing while the warmup is off. The engine floors it at 5 s.
mp_team_intro_time 0              // Skip the team-intro cinematic before the first round.
mp_warmup_pausetimer 0            // Keep the warmup timer running.
mp_round_restart_delay 0          // No pause after the golden-knife kill; straight into the next match.
mp_freezetime 0                   // No frozen countdown at round start.
mp_match_end_restart 1            // Restart on the same map when the match ends.
mp_match_end_changelevel 0        // Do not rotate to the mapgroup at match end; the chat bridge drives map changes.
mp_endmatch_votenextmap 0         // No CS2 end-of-match map vote: the bridge's own vote is on the HUD (bridge/VoteRound.cs).
mp_match_restart_delay 90         // The match-end screen lasts through the bridge's vote: 60 s, the 8 s countdown and over 15 s of margin, since CS2 shows 4 s less than this (CS2's 25).
                                  // When the vote plays the map again, the plugin ends the screen at the vote's 8 s countdown (os_nextmatch).

// No CS2 votes at all: map changes go through the bridge's vote.
sv_allow_votes 0                  // Master switch for the F1/F2 vote UI.
sv_vote_issue_changelevel_allowed 0
sv_vote_issue_nextlevel_allowed 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_restart_game_allowed 0
sv_vote_issue_pause_match_allowed 0
sv_vote_issue_timeout_allowed 0
sv_vote_issue_surrrender_allowed 0   // Valve's spelling, three r's; the convar with two does not exist.
sv_vote_issue_matchready_allowed 0
sv_vote_issue_loadbackup_allowed 0
sv_vote_issue_scramble_teams_allowed 0
sv_vote_issue_swap_teams_allowed 0

// Small-group comfort.
mp_autokick 0                     // Never kick idle friends.
mp_autoteambalance 1              // Keep teams even as people join and leave.
mp_limitteams 1                   // Max team-size difference of 1 (mode default 2).
mp_teammates_are_enemies 0        // 0 = two teams; 1 = free-for-all gun game.
mp_randomspawn 1                  // Mode default; spawn anywhere instead of team spawns.
mp_randomspawn_los 1              // Mode default 0; Valve's Deathmatch sets 1. Meant to pick a spawn point no enemy sees, but measured in Arms Race
                                  // (8 bots, ar_shoots and ar_baggage) it made no difference: an enemy had 10 of 142 spawns spotted within 0.75 s with
                                  // it on, 10 of 145 with it off (p = 1.00). Kept on; play is as it was.
mp_respawn_immunitytime 5         // Mode default 10 s of spawn protection is long on small maps.
mp_solid_teammates 1              // Mode sets 2, which lets teammates walk through each other; 1 makes them solid so you can boost.
mp_team_timeout_max 0             // No tactical timeouts in gun game.
mp_join_grace_time 0              // CS2's own; Wingman sets 30, which would otherwise stay.
sv_workshop_allow_other_maps 1    // Let host_workshop_map load any workshop map, not only collection members.

// Grenades: the gun-game loadout ignores mp_*_default_grenades (tested live 2026-09-15), so the plugin's grenade drops
// (plugin/OverStrike2/Nades.cs) hand every player an HE shortly after spawning; this setting makes the engine drop it where they die.
mp_death_drop_grenade 2           // Mode default 0 = never; 2 = drop the held or best grenade on death.

// Friendly fire, on and deadly. The mode cfg sets mp_friendlyfire 1 but every ff_damage_reduction_* to 0, so a
// teammate would take no damage at all. Despite the name, each one is the share of an enemy's
// damage a teammate takes (1 = the same as an enemy); Valve documents 0-1, the server accepts more. These are the defaults
// of the menu's fun page (bridge/Shared/Fun.cs: Friendly fire, Instakill, Grenades x10, all On): a player's change lasts
// until the map changes, and every map load starts from these again. A map that sets its own keeps it for its match.
mp_friendlyfire 1                 // Mode default 1. Off (0): no damage to teammates at all, whatever the next three say.
ff_damage_reduction_bullets 100   // Mode default 0 = none. 100 = a hundred times an enemy's damage: any hit kills (Instakill).
ff_damage_reduction_other 100     // Mode default 0. The knife and the rest that are not bullets or grenades (Instakill).
ff_damage_reduction_grenade 1     // Mode default 0. 1 = a grenade hurts a teammate as it hurts an enemy; Grenades x10 is off by default (its Fun page's On sets 10).
